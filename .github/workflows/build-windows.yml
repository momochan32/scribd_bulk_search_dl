name: Build Windows EXE

# PyInstaller is not a cross-compiler: a Windows .exe can only be produced on
# Windows. This builds it on a GitHub-hosted Windows runner so releases do not
# depend on anyone owning a Windows machine.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 3.11 matches the local development environment the app is tested on.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      # The spec is platform-aware: it picks the .ico on Windows and skips the
      # macOS-only BUNDLE step, so CI and local builds stay identical.
      - name: Build EXE
        run: pyinstaller --noconfirm --clean Momo_Rescribd.spec

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "dist/Momo Rescribd/Momo Rescribd.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build did not produce $exe"
            exit 1
          }
          Write-Host "Built $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 2)) MB)"

      - name: Package as ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist/Momo Rescribd" -DestinationPath "Momo-Rescribd-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momo-Rescribd-Windows
          path: Momo-Rescribd-Windows.zip
          if-no-files-found: error
          retention-days: 30
