# Kamus domain riset Solcoat — boleh diedit tim teknis tanpa menyentuh kode.
# Sinonim ditulis sebagai fragmen regex (tanpa batas kata; ditambahkan otomatis, huruf besar/kecil diabaikan).
#
# tier peralatan:
#   A = target langsung Solcoat (berapi, hot face refraktori >= 500 °C)
#   B = terkait (panas/refraktori, tapi bukan target utama)
#   C = peralatan proses lain (dilacak supaya relasi tidak salah tempel)
# role: unit | part (bagian dari unit induk) | material

equipment:
  - key: primary_reformer
    label: Primary Reformer
    tier: A
    role: unit
    synonyms: ['primar[yi]\s+reformer', 'steam\s+reformer', 'reformer\s+furnace', 'reformer\s+primer', 'primary\s+reforming']
  - key: secondary_reformer
    label: Secondary Reformer
    tier: B
    role: unit
    synonyms: ['secondary\s+reformer', 'secondary\s+reforming', 'autothermal\s+reform(?:er|ing)', 'reformer\s+sekunder']
  - key: sulfur_furnace
    label: Sulfur Furnace / Burner
    tier: A
    role: unit
    synonyms: ['sul(?:ph|f)ur\s+(?:furnace|burner|combustion\s+furnace)', 'furnace\s+sul(?:ph|f)ur', 'tungku\s+belerang']
  - key: coal_boiler
    label: Boiler Batubara
    tier: A
    role: unit
    synonyms: ['boiler\s+batu\s?bara', 'coal[-\s]fired\s+boiler', 'coal\s+boiler', 'cfb\s+boiler', 'circulating\s+fluidi[sz]ed\s+bed', 'pulveri[sz]ed\s+coal\s+boiler']
  - key: aux_boiler
    label: Auxiliary / Package Boiler
    tier: A
    role: unit
    synonyms: ['auxiliary\s+boiler', 'aux\.?\s+boiler', 'package\s+boiler', 'fire\s+tube\s+boiler', 'water\s+tube\s+boiler', 'steam\s+boiler', 'boiler\s+pabrik']
  - key: waste_heat_boiler
    label: Waste Heat Boiler / HRSG
    tier: B
    role: unit
    synonyms: ['waste\s+heat\s+boiler', 'WHB', 'HRSG', 'heat\s+recovery\s+steam\s+generator']
  - key: fired_heater
    label: Fired Heater
    tier: A
    role: unit
    synonyms: ['fired\s+heater', 'process\s+heater', 'charge\s+heater', 'start[-\s]?up\s+heater', 'direct[-\s]fired\s+heater', 'fire\s+heater', 'crude\s+(?:oil\s+)?(?:charge\s+)?heater', '(?:CDU|VDU|HVU|CCR|NHT|DHT)\s+(?:heater|furnace)', 'vacuum\s+heater', 'reboiler\s+(?:heater|furnace)', 'platformer\s+heater', 'hydrotreater\s+heater', 'visbreaker\s+heater', 'coker\s+heater']
  - key: cracking_furnace
    label: Cracking / Pyrolysis Furnace
    tier: A
    role: unit
    synonyms: ['cracking\s+furnace', 'ethylene\s+(?:cracking\s+)?furnace', 'pyrolysis\s+furnace', 'steam\s+cracker', 'naphtha\s+cracker']
  - key: steel_furnace
    label: Reheating / Heat Treatment Furnace (baja)
    tier: A
    role: unit
    synonyms: ['reheating\s+furnace', 'walking\s+beam\s+furnace', 'pusher\s+(?:type\s+)?furnace', 'annealing\s+furnace', 'heat\s+treatment\s+furnace', 'soaking\s+pit', 'ladle\s+(?:pre)?heater', 'hot\s+blast\s+stove', 'tundish\s+(?:pre)?heater']
  - key: incinerator
    label: Incinerator / Thermal Oxidizer
    tier: A
    role: unit
    synonyms: ['incinerator', 'insinerator', 'thermal\s+oxidi[sz]er']
  - key: kiln
    label: Kiln / Calciner
    tier: A
    role: unit
    synonyms: ['rotary\s+kiln', 'kiln', 'calciner', 'kalsiner']
  - key: hot_gas_generator
    label: Hot Gas Generator / Combustion Chamber
    tier: A
    role: unit
    synonyms: ['hot\s+(?:gas|air)\s+generator', 'combustion\s+chamber', 'ruang\s+bakar', 'hot\s+air\s+furnace']
  - key: furnace
    label: Furnace (umum)
    tier: A
    role: unit
    synonyms: ['furnace', 'tanur', 'dapur\s+pembakaran', 'tungku']
  - key: boiler
    label: Boiler (umum)
    tier: A
    role: unit
    synonyms: ['boiler', 'ketel\s+uap']
    exclude: ['boiler\s+feed', 'umpan\s+boiler', 'boiler\s+water', 'air\s+boiler', 'BFW', 'blowdown\s+boiler']
  - key: dryer
    label: Dryer (berpemanas)
    tier: B
    role: unit
    synonyms: ['rotary\s+dryer', 'dryer', 'pengering']
  - key: superheater
    label: Superheater
    tier: B
    role: unit
    synonyms: ['superheater', 'super\s+heater']
  - key: gas_turbine
    label: Gas Turbine Generator
    tier: C
    role: unit
    synonyms: ['gas\s+turbine\s+generator', 'gas\s+turbin(?:e)?', 'GTG']
  - key: radiant_section
    label: Seksi Radiasi
    tier: B
    role: part
    synonyms: ['radiant\s+(?:section|box|zone|chamber)', 'seksi\s+radiasi', 'zona\s+radiasi', 'ruang\s+radiasi']
  - key: convection_section
    label: Seksi Konveksi
    tier: B
    role: part
    synonyms: ['convection\s+section', 'seksi\s+konveksi', 'zona\s+konveksi', 'waste\s+heat\s+(?:section|recovery)']
  - key: burner
    label: Burner
    tier: B
    role: part
    synonyms: ['burner', 'pembakar']
  - key: stack
    label: Stack / Cerobong
    tier: B
    role: part
    synonyms: ['stack', 'cerobong(?:\s+asap)?', 'chimney']
    exclude: ['stack\s+holder', 'stakeholder']
  - key: refractory
    label: Refraktori / Lining
    tier: A
    role: material
    synonyms: ['refrakto?ri', 'refractory', 'castable', 'batu\s+tahan\s+api', 'bata\s+tahan\s+api', 'fire\s?brick', 'ceramic\s+fib(?:er|re)', 'insulating\s+brick', 'refractory\s+lining', 'lining\s+refraktori']

parameters:
  - key: suhu_flue_gas
    label: Suhu flue gas / gas buang
    category: termal
    kinds: [suhu]
