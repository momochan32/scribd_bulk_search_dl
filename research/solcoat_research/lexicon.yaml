    synonyms: ['flue\s+gas', 'gas\s+buang', 'gas\s+asap', 'stack\s+gas', 'exhaust\s+gas', 'stack\s+temperature', 'suhu\s+cerobong']
  - key: suhu_bridgewall
    label: Suhu bridgewall / firebox (FEGT)
