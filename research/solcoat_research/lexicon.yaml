# Pabrik/unit. company boleh kosong bila nama pabrik dipakai lintas perusahaan (mis. 'Pabrik 1A').
plants:
  - {pattern: 'Kaltim[-\s]?[1-5][AB]?', company: Pupuk Kalimantan Timur}
  - {pattern: 'POPKA', company: Pupuk Kalimantan Timur}
  - {pattern: 'RU[-\s]?(?:II|III|IV|V|VI|VII)', company: Pertamina}
  - {pattern: 'Kilang\s+(?:Dumai|Plaju|Cilacap|Balikpapan|Balongan|Kasim)', company: Pertamina}
  - {pattern: 'Pusri[-\s]?(?:I{1,3}B?|IV|[1-4]B?)', company: Pupuk Sriwidjaja}
  - {pattern: 'Kujang[-\s]?1[AB]', company: Pupuk Kujang}
  - {pattern: 'Amurea\s+I{1,2}', company: Petrokimia Gresik}
  - {pattern: 'Unit\s+ZA\s?I{1,3}', company: Petrokimia Gresik}
