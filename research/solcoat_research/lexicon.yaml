    kinds: [panjang]
    range: [1, 1000]
    synonyms: ['tebal\s+(?:refrakto?ri|castable|lining|batu\s+tahan\s+api|bata\s+tahan\s+api|isolasi|insulasi)', 'refractory\s+thickness', 'lining\s+thickness', 'ketebalan\s+(?:refrakto?ri|lining|castable)']
  - key: dimensi
