    range: [0.01, 3000]
    synonyms: ['heat\s+duty', 'absorbed\s+duty', 'fired\s+duty', 'heat\s+absorb(?:ed|tion)', 'absorbed\s+heat', 'process\s+duty', 'duty', 'heat\s+release', 'heat\s+load', 'beban\s+(?:panas|termal)', 'panas\s+(?:yang\s+)?(?:diserap|dilepas|dibutuhkan)', 'kebutuhan\s+panas']
  - key: luas_permukaan
    label: Luas permukaan / area
