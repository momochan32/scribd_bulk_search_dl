    kinds: [luas]
    range: [0.01, 500000]
    synonyms: ['surface\s+area', 'heat\s+transfer\s+area', 'bare\s+tube\s+area', 'extended\s+surface\s+area', 'radiant\s+(?:section\s+)?area', 'refractory\s+area', 'hot\s+face\s+area', 'luas(?:\s+(?:permukaan|area|bidang|lahan))?', 'luasan', 'area']
  - key: tebal_lining
    label: Tebal refraktori / lining
